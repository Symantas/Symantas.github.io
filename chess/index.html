<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; connect-src 'self' https://api.chess.com; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1a1a19">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mistakes">
<title>Mistake trainer — learn from your Chess.com games</title>
<!--
  Mistake trainer. Static site: index.html + app.js + vendor/ (chess.js, BSD; Stockfish via stockfish.js, GPLv3 - licences in vendor/).
  The only outside connection is Chess.com's public API, to download games. All data stays in this browser (localStorage).
-->
<script src="vendor/chess.js"></script>
<style>
:root{color-scheme:light;--bg:#f3f2ee;--card:#fcfcfb;--line:#e1e0d9;--text:#0b0b0b;--dim:#52514e;--mute:#898781;
--accent:#2a78d6;--onaccent:#fff;--good:#0ca30c;--crit:#d03b3b;--warn:#fab219;--neutral:#b9b7ae;--field:#fff;--hover:#eceae4;
--sq:min(calc((100vw - 60px)/8),58px)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111110;--card:#1a1a19;--line:#2c2c2a;--text:#f0efec;--dim:#c3c2b7;
--mute:#898781;--accent:#3987e5;--onaccent:#06121f;--neutral:#5a5953;--field:#111110;--hover:#262624}}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:12px 12px 80px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
h1{font-size:19px;margin:0;flex:1 1 auto}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:0 0 10px;font-weight:600}
h3{font-size:16px;margin:0 0 4px}
p{margin:6px 0}
.tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:7px 13px;border-radius:7px;color:var(--dim);white-space:nowrap}
.tabs button.on{background:var(--hover);color:var(--text);font-weight:600}
.badge{background:var(--accent);color:var(--onaccent);border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.grid2>.card{margin:0}
.grid2{margin-bottom:12px}
input,select,button{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
button{cursor:pointer;background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}
button.link{background:none;border:0;color:var(--accent);padding:0}
button:disabled{opacity:.45;cursor:default}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.start{display:flex;gap:10px;flex-wrap:wrap}.start input{flex:1 1 200px;font-size:17px}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.opts label{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:4px;flex:1 1 130px}
details summary{cursor:pointer;color:var(--dim);font-size:13px;margin-top:12px}
.dim{color:var(--dim);font-size:13px}.err{color:var(--crit)}
#prog{position:sticky;top:0;z-index:5}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px 10px}
.tile b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{color:var(--dim);font-size:12px;display:block}.tile em{color:var(--mute);font-size:11px;font-style:normal;display:block}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:4px 0;font-size:14px}
.row .c{color:var(--dim);font-variant-numeric:tabular-nums}
.row .m{grid-column:1/3;height:6px;background:var(--line);border-radius:4px}
.row .m i{display:block;height:100%;background:var(--accent);border-radius:4px;min-width:2px}
.wdl{display:flex;gap:2px;height:12px;margin:4px 0 2px}.wdl i{display:block;border-radius:3px;min-width:2px}
.wdlrow{margin-bottom:10px}.wdlrow div:first-child{display:flex;justify-content:space-between;font-size:14px}
.key{display:flex;gap:12px;font-size:12px;color:var(--dim);margin-bottom:8px}.key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
th,td{text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tipbox{position:absolute;pointer-events:none;background:var(--text);color:var(--card);font-size:12px;padding:3px 7px;border-radius:6px;
transform:translate(-50%,-130%);white-space:nowrap;display:none}
.tip{border-left:3px solid var(--warn);padding:2px 0 2px 12px;margin-bottom:18px}.tip:last-child{margin-bottom:0}
.why{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:10px 0}
.tip .n{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--warn);color:#201800;font-weight:700;font-size:13px;
text-align:center;line-height:22px;margin-right:8px}
.check{list-style:none;padding:0;margin:0}.check li{padding:6px 0 6px 28px;position:relative}
.check li::before{content:"✓";position:absolute;left:4px;color:var(--good);font-weight:700}
.trainer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:760px){.trainer{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(8,var(--sq));grid-template-rows:repeat(8,var(--sq));border-radius:6px;overflow:hidden;
user-select:none;-webkit-user-select:none;touch-action:manipulation;width:max-content;margin:0 auto}
.s{display:flex;align-items:center;justify-content:center;font-size:calc(var(--sq)*.78);line-height:1;position:relative}
.s.l{background:#dfe5e8}.s.d{background:#7f98a6}
.s.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 2px #000}.s.b{color:#15181c}
.s::after{content:"";position:absolute;inset:0;pointer-events:none}
.s.last::after{background:rgba(242,184,75,.45)}.s.bad::after{background:rgba(230,70,70,.55)}
.s.good::after{background:rgba(40,190,110,.6)}.s.sel::after{background:rgba(57,135,229,.55)}
.s.hint::after{box-shadow:inset 0 0 0 4px var(--warn)}
.s.dot::before{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(20,30,40,.4);z-index:2}
.s>span{position:relative;z-index:1;will-change:transform}.play .s{cursor:pointer}.board.play{touch-action:none}
.bwrap{position:relative;width:max-content;margin:0 auto}#arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cap{min-height:26px;margin-top:8px;text-align:center;font-weight:600;max-width:calc(var(--sq)*8);margin-left:auto;margin-right:auto}
.side{min-height:190px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.verdict{font-weight:600;font-size:16px;margin:10px 0 4px}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--hover);color:var(--dim);margin-right:4px;white-space:nowrap}
.item{padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.item:hover{background:var(--hover)}.item small{color:var(--dim);display:block}
.leak{padding:10px 0;border-bottom:1px solid var(--line)}.leak:last-child{border:0}
a{color:var(--accent)}.hide{display:none!important}
</style></head><body><main>

<header>
  <h1>Mistake trainer</h1>
  <nav class="tabs hide" id="tabs">
    <button data-tab="over" class="on">Overview</button>
    <button data-tab="coach">Coach</button>
    <button data-tab="train">Train<span class="badge hide" id="dueBadge"></span></button>
    <button data-tab="prog2">Progress</button>
    <button data-tab="browse">Mistakes</button>
  </nav>
</header>

<section id="setup" class="card">
  <h3>Learn from your own games</h3>
  <p class="dim">Type your Chess.com username. You get your statistics in seconds, then the engine goes through your recent games,
  finds the mistakes that cost you the most, and turns them into training cards that come back until you stop making them.</p>
  <div class="start" style="margin-top:12px">
    <input id="user" placeholder="Chess.com username" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="primary" id="go">Start</button>
  </div>
  <details><summary>Options</summary>
    <div class="opts">
      <label>Games for engine analysis<select id="count"><option>10<option selected>20<option>40<option>80</select></label>
      <label>Time control<select id="tc"><option value="all">All<option value="rapid">Rapid<option value="blitz">Blitz<option value="bullet">Bullet<option value="daily">Daily</select></label>
      <label>Analysis<select id="mode"><option value="fast">Fast<option value="normal" selected>Normal<option value="thorough">Thorough (every move at full depth)</select></label>
    </div>
  </details>
</section>

<div id="prog" class="card hide"><div id="pmsg" style="font-size:14px">Working…</div><div class="bar"><i id="fill"></i></div><div class="dim" id="psub"></div></div>
<div id="error" class="card err hide"></div>

<section id="over" class="hide"></section>
<section id="coach" class="hide"></section>
<section id="prog2" class="hide"></section>
<section id="train" class="hide">
  <div class="card">
    <div id="trainEmpty" class="hide"></div>
    <div class="trainer" id="trainer"><div><div class="bwrap"><div class="board" id="board"></div><svg id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg></div><div class="cap" id="cap" aria-live="polite"></div></div><div class="side" id="side"></div></div>
  </div>
</section>
<section id="browse" class="hide">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px">
      <h2 style="margin:0" id="browseTitle"></h2><select id="browseFilter"></select>
    </div>
    <div id="list"></div>
  </div>
</section>
</main>
<script src="app.js"></script></body></html>
